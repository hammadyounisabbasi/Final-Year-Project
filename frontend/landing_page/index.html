<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University of Haripur | Portal</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <script src="../shared/config.js"></script>
</head>

<body>

    <main class="page">

        <!-- Background -->

        <div class="background-glow"></div>

        <!-- Main Card -->

        <section class="portal-card">

            <!-- Header -->

            <header class="portal-header">

                <div class="logo-box">

                    <img src="uoh-logo.png"
                        alt="University of Haripur Logo">

                </div>

                <div class="title-box">

                    <p class="welcome-text">
                        Welcome to
                    </p>

                    <h1>
                        University of Haripur
                    </h1>

                    <span>
                        Smart Learning Management System
                    </span>

                </div>

            </header>

            <!-- Divider -->

            <div class="divider"></div>

            <!-- Content -->

            <section class="portal-content">

                <h2>
                    Select Your Role
                </h2>

                <p>
                    Continue by selecting your portal.
                </p>

            </section>

            <!-- Buttons -->

            <section class="role-buttons">

                <button id="studentBtn" class="role-btn">

                    <span class="icon">
                        <i class="fa-solid fa-user-graduate"></i>
                    </span>

                    <span>
                        Student
                    </span>

                </button>

                <button id="teacherBtn" class="role-btn">

                    <span class="icon">
                        <i class="fa-solid fa-chalkboard-user"></i>
                    </span>

                    <span>
                        Teacher
                    </span>

                </button>

                <button id="adminBtn" class="role-btn">

                    <span class="icon">
                        <i class="fa-solid fa-user-shield"></i>
                    </span>

                    <span>
                        Administrator
                    </span>

                </button>

            </section>

            <!-- Footer -->

            <footer>

                © 2026 University of Haripur

            </footer>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
